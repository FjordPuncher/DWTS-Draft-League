<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dancing with the Stars Fantasy League &mdash; Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#14121B;
    --bg-panel:#1E1B2E;
    --bg-panel-raised:#262238;
    --gold:#D4AF37;
    --gold-soft:#E8CA6E;
    --rose:#E0507A;
    --rose-soft:#F0819E;
    --cream:#F3EEE4;
    --muted:#9A93AE;
    --line:#332F47;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #201C2E 0%, var(--bg-deep) 55%);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .app{max-width:820px;margin:0 auto;padding:36px 20px 60px;}

  header.top{
    display:flex;align-items:center;gap:14px;
    padding-bottom:18px;border-bottom:1px solid var(--line);
    margin-bottom:8px;
  }
  .brand-lockup{position:relative;}
  .chrome-line{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:1.7rem;line-height:1.05;letter-spacing:0.005em;text-transform:uppercase;margin:0;
    background:linear-gradient(180deg,#eef1f4 0%, #ffffff 10%, #9a9ea6 28%, #4b4e56 46%, #7d818a 60%, #e3e6ea 78%, #ffffff 88%, #6d7078 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,0.55));
    white-space:nowrap;
  }
  .gold-line{
    font-family:'Fredoka',sans-serif;font-weight:600;
    font-size:0.92rem;letter-spacing:0.16em;text-transform:uppercase;margin-top:2px;
    background:linear-gradient(120deg,var(--gold-soft),var(--gold) 50%,var(--rose-soft));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sparkle{position:absolute;pointer-events:none;filter:drop-shadow(0 0 3px rgba(255,255,255,0.8));}
  .sparkle.sp1{top:-6px;right:-2px;}
  .sparkle.sp2{bottom:6px;left:-10px;}
  .meta-row{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    margin:14px 0 26px;color:var(--muted);font-size:0.85rem;
  }
  .meta-row .season-tag{
    color:var(--gold-soft);font-weight:700;letter-spacing:0.02em;
  }

  .standing-card{
    position:relative;overflow:hidden;
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;
  }
  .standing-card.rank-1{border-color:var(--gold);}
  .standing-card.rank-1::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 30%, rgba(212,175,55,0.10) 50%, transparent 70%);
    background-size:220% 100%;
    animation:sweep 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{0%{background-position:180% 0;}100%{background-position:-40% 0;}}
  .standing-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;cursor:pointer;gap:12px;position:relative;z-index:1;
  }
  .standing-left{display:flex;align-items:center;gap:14px;}
  .rank-badge{font-family:'Bebas Neue';font-size:1.4rem;color:var(--muted);width:34px;text-align:center;}
  .rank-1 .rank-badge{color:var(--gold);}
  .team-name{font-weight:700;font-size:1.05rem;}
  .standing-score{font-family:'Bebas Neue';font-size:1.9rem;color:var(--gold-soft);letter-spacing:0.02em;}
  .rank-1 .standing-score{color:var(--gold);}
  .chevron{color:var(--muted);transition:transform .2s ease;font-size:0.8rem;}
  .standing-card.open .chevron{transform:rotate(180deg);}
  .standing-detail{display:none;padding:0 20px 18px;position:relative;z-index:1;}
  .standing-card.open .standing-detail{display:block;}
  table.breakdown{width:100%;border-collapse:collapse;font-size:0.85rem;}
  table.breakdown th{
    text-align:left;color:var(--muted);font-weight:600;font-size:0.72rem;
    text-transform:uppercase;letter-spacing:0.04em;padding:6px 8px;border-bottom:1px solid var(--line);
  }
  table.breakdown td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,0.04);}
  table.breakdown tr:last-child td{border-bottom:none;}
  .pts-pos{color:var(--gold-soft);font-weight:700;}
  .pts-neg{color:var(--rose);font-weight:700;}
  .empty-note{color:var(--muted);font-size:0.85rem;font-style:italic;padding:8px 0;}
  .week-pill{
    display:inline-block;background:var(--bg-panel-raised);border:1px solid var(--line);
    border-radius:999px;padding:2px 10px;font-size:0.75rem;color:var(--muted);
  }
  .owner-badge{
    display:inline-block;font-size:0.68rem;font-weight:700;letter-spacing:0.02em;
    padding:1px 8px;border-radius:999px;margin-right:4px;
  }

  /* LOAD STATE */
  .load-card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px;text-align:center;
  }
  .load-card p{color:var(--muted);font-size:0.9rem;line-height:1.5;}
  .drop-zone{
    border:1.5px dashed var(--line);border-radius:8px;padding:26px;margin:18px 0;
    cursor:pointer;transition:border-color .15s ease;
  }
  .drop-zone:hover, .drop-zone.dragover{border-color:var(--gold);}
  .drop-zone span{color:var(--gold-soft);font-weight:700;}
  button.primary{
    background:linear-gradient(120deg,var(--gold),var(--rose));border:none;color:#1A1522;
    font-weight:700;padding:11px 22px;border-radius:8px;cursor:pointer;font-size:0.92rem;
  }
  button.ghost{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;text-decoration:underline;}
  .error-box{
    background:rgba(224,80,122,0.1);border:1px solid rgba(224,80,122,0.35);color:var(--rose-soft);
    padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-top:12px;
  }
  .footer-note{color:var(--muted);font-size:0.78rem;text-align:center;margin-top:32px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-text">
      <div class="brand-lockup">
        <p class="chrome-line">Dancing with the Stars</p>
        <p class="gold-line">Fantasy League &middot; Leaderboard</p>
        <svg class="sparkle sp1" width="14" height="14" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z" fill="#ffffff"/></svg>
        <svg class="sparkle sp2" width="10" height="10" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z" fill="#E8CA6E"/></svg>
      </div>
    </div>
  </header>

  <div id="metaRow" class="meta-row" style="display:none;">
    <div><span class="season-tag" id="metaSeason"></span></div>
    <div id="metaUpdated"></div>
  </div>

  <div id="loadState" class="load-card">
    <p>Looking for this week's standings&hellip;</p>
  </div>

  <div id="standingsList"></div>

  <p class="footer-note" id="footerNote" style="display:none;">Read-only view &middot; scores are logged in the main Mirrorball Ledger app</p>
</div>

<script>
let data = null;

function fmtDate(iso){
  if(!iso) return "";
  try{
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) +
      " at " + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }catch(e){ return ""; }
}

function contrastText(hex){
  if(!hex) return '#14121B';
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b)/255;
  return luminance > 0.55 ? '#14121B' : '#F3EEE4';
}

function ownerById(id){ return data.owners.find(o=>o.id===id); }
function categoryById(id){ return data.categories.find(c=>c.id===id); }
function dancerById(id){ return data.dancers.find(d=>d.id===id); }
function ownersForDancer(dancerId){
  return data.draft.filter(d=>d.dancerId===dancerId).map(d=>d.ownerId);
}
function allInstances(){
  const out = [];
  (data.events||[]).forEach(ev=>{
    const cat = categoryById(ev.categoryId);
    if(!cat) return;
    ev.instances.forEach(inst=>{
      ownersForDancer(inst.dancerId).forEach(ownerId=>{
        out.push({week:ev.week, categoryLabel:cat.label, points:cat.points, enabled:cat.enabled, dancerId:inst.dancerId, ownerId});
      });
    });
  });
  return out;
}
function ownerTotal(ownerId){
  return allInstances().filter(i=>i.ownerId===ownerId && i.enabled!==false).reduce((s,i)=>s+i.points,0);
}

function renderLeaderboard(){
  document.getElementById('loadState').style.display = 'none';
  document.getElementById('footerNote').style.display = 'block';

  const metaRow = document.getElementById('metaRow');
  metaRow.style.display = 'flex';
  document.getElementById('metaSeason').textContent = data.seasonName || 'This Season';
  document.getElementById('metaUpdated').textContent = data.exportedAt ? ('Updated ' + fmtDate(data.exportedAt)) : '';

  const rows = data.owners.map(o=>({owner:o,total:ownerTotal(o.id)})).sort((a,b)=>b.total-a.total);
  const list = document.getElementById('standingsList');
  list.innerHTML = rows.map((r,idx)=>{
    const rankClass = idx===0 ? 'rank-1' : '';
    const detail = allInstances().filter(i=>i.ownerId===r.owner.id && i.enabled!==false).sort((a,b)=>a.week-b.week);
    const detailRows = detail.length ? detail.map(i=>{
      const d = dancerById(i.dancerId);
      const cls = i.points>=0 ? 'pts-pos':'pts-neg';
      return `<tr>
        <td><span class="week-pill">Wk ${i.week}</span></td>
        <td>${i.categoryLabel}</td>
        <td>${d?d.name:'?'} <span style="color:var(--muted);">/ ${d?d.partner:'?'}</span></td>
        <td class="${cls}">${i.points>0?'+':''}${i.points}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="4" class="empty-note">No points logged yet for this team.</td></tr>`;

    return `<div class="standing-card ${rankClass}" id="card-${r.owner.id}">
      <div class="standing-head" onclick="document.getElementById('card-${r.owner.id}').classList.toggle('open')">
        <div class="standing-left">
          <div class="rank-badge">#${idx+1}</div>
          <div>
            <div class="team-name">
              ${r.owner.name}
              ${r.owner.color ? `<span class="owner-badge" style="background:${r.owner.color};color:${contrastText(r.owner.color)};margin-left:6px;">&nbsp;</span>` : ''}
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div class="standing-score">${r.total}</div>
          <div class="chevron">&#9660;</div>
        </div>
      </div>
      <div class="standing-detail">
        <table class="breakdown">
          <thead><tr><th>Week</th><th>Category</th><th>Dancer / Celebrity</th><th>Pts</th></tr></thead>
          <tbody>${detailRows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function showLoadPrompt(message){
  const box = document.getElementById('loadState');
  box.innerHTML = `
    <p>${message}</p>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span>Click to choose a file</span><br>or drag a backup JSON here
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none;">
    <p style="font-size:0.78rem;">Export a backup from the main Mirrorball Ledger app, then load it here.</p>
  `;
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  fi.addEventListener('change', e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('dragover'));
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.classList.remove('dragover');
    if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
}

function loadFile(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.dancers || !parsed.owners){ throw new Error("bad shape"); }
      data = parsed;
      renderLeaderboard();
    }catch(err){
      showLoadPrompt("That file doesn't look like a Mirrorball Ledger export. Try exporting again from the main app.");
    }
  };
  reader.readAsText(file);
}

/* Try to auto-load leaderboard-data.json sitting next to this page (works when hosted, e.g. GitHub Pages) */
fetch('./leaderboard-data.json', {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('not found'); return r.json(); })
  .then(json=>{ data = json; renderLeaderboard(); })
  .catch(()=>{
    showLoadPrompt("No leaderboard-data.json found next to this page yet.");
  });
</script>
</body>
</html>
