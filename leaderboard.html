<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dancing with the Stars Fantasy League &mdash; Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#14121B;
    --bg-panel:#1E1B2E;
    --bg-panel-raised:#262238;
    --gold:#D4AF37;
    --gold-soft:#E8CA6E;
    --rose:#E0507A;
    --rose-soft:#F0819E;
    --cream:#F3EEE4;
    --muted:#9A93AE;
    --line:#332F47;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #201C2E 0%, var(--bg-deep) 55%);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .app{max-width:820px;margin:0 auto;padding:36px 20px 60px;}

  header.top{
    display:flex;align-items:center;gap:14px;
    padding-bottom:18px;border-bottom:1px solid var(--line);
    margin-bottom:8px;
  }
  .brand-lockup{position:relative;}
  .chrome-line{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(1.15rem, 6vw, 1.9rem);line-height:1.05;letter-spacing:0.005em;text-transform:uppercase;margin:0;
    background:linear-gradient(180deg,#eef1f4 0%, #ffffff 10%, #9a9ea6 28%, #4b4e56 46%, #7d818a 60%, #e3e6ea 78%, #ffffff 88%, #6d7078 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,0.55));
    white-space:nowrap;
  }
  .gold-line{
    font-family:'Fredoka',sans-serif;font-weight:600;
    font-size:clamp(0.6rem, 2.6vw, 0.92rem);letter-spacing:0.14em;text-transform:uppercase;margin-top:2px;
    background:linear-gradient(120deg,var(--gold-soft),var(--gold) 50%,var(--rose-soft));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;
  }
  .sparkle{position:absolute;pointer-events:none;filter:drop-shadow(0 0 3px rgba(255,255,255,0.8));}
  .sparkle.sp1{top:-6px;right:-2px;}
  .sparkle.sp2{bottom:6px;left:-10px;}
  .meta-row{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    margin:14px 0 26px;color:var(--muted);font-size:0.85rem;
  }
  .meta-row .season-tag{
    color:var(--gold-soft);font-weight:700;letter-spacing:0.02em;
  }

  .standing-card{
    position:relative;overflow:hidden;
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;
  }
  .standing-card.rank-1{border-color:var(--gold);}
  .standing-card.rank-1::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 30%, rgba(212,175,55,0.10) 50%, transparent 70%);
    background-size:220% 100%;
    animation:sweep 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{0%{background-position:180% 0;}100%{background-position:-40% 0;}}
  .standing-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;cursor:pointer;gap:12px;position:relative;z-index:1;
  }
  .standing-left{display:flex;align-items:center;gap:14px;}
  .rank-badge{font-family:'Bebas Neue';font-size:1.4rem;color:var(--muted);width:34px;text-align:center;}
  .rank-1 .rank-badge{color:var(--gold);}
  .team-name{font-weight:700;font-size:1.05rem;}
  .owner-name{color:var(--muted);font-size:0.82rem;}
  .card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:14px;
  }
  .standing-score{font-family:'Bebas Neue';font-size:1.9rem;color:var(--gold-soft);letter-spacing:0.02em;}
  .rank-1 .standing-score{color:var(--gold);}
  .chevron{color:var(--muted);transition:transform .2s ease;font-size:0.8rem;}
  .standing-card.open .chevron{transform:rotate(180deg);}
  .standing-detail{display:none;padding:0 20px 18px;position:relative;z-index:1;}
  .standing-card.open .standing-detail{display:block;}
  .scores-heading{
    font-family:'Bebas Neue';font-size:0.95rem;letter-spacing:0.04em;color:var(--gold-soft);
    margin:10px 0 6px;
  }
  .dancer-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  @media(min-width:640px){.dancer-grid{grid-template-columns:1fr 1fr;}}
  .dancer-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--bg-panel-raised);border:1px solid var(--line);border-radius:8px;padding:9px 12px;
  }
  .dancer-row .dname{font-size:0.88rem;}
  .dancer-row .dname .pname{color:var(--muted);font-size:0.78rem;display:block;}
  table.breakdown{width:100%;border-collapse:collapse;font-size:0.85rem;}
  table.breakdown th{
    text-align:left;color:var(--muted);font-weight:600;font-size:0.72rem;
    text-transform:uppercase;letter-spacing:0.04em;padding:6px 8px;border-bottom:1px solid var(--line);
  }
  table.breakdown td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,0.04);}
  table.breakdown tr:last-child td{border-bottom:none;}
  .pts-pos{color:var(--gold-soft);font-weight:700;}
  .pts-neg{color:var(--rose);font-weight:700;}
  .empty-note{color:var(--muted);font-size:0.85rem;font-style:italic;padding:8px 0;}
  .week-pill{
    display:inline-block;background:var(--bg-panel-raised);border:1px solid var(--line);
    border-radius:999px;padding:2px 10px;font-size:0.75rem;color:var(--muted);
  }
  .owner-badge{
    display:inline-block;font-size:0.68rem;font-weight:700;letter-spacing:0.02em;
    padding:1px 8px;border-radius:999px;margin-right:4px;
  }

  /* LOAD STATE */
  .load-card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px;text-align:center;
  }
  .load-card p{color:var(--muted);font-size:0.9rem;line-height:1.5;}
  button.primary{
    background:linear-gradient(120deg,var(--gold),var(--rose));border:none;color:#1A1522;
    font-weight:700;padding:11px 22px;border-radius:8px;cursor:pointer;font-size:0.92rem;
  }
  button.ghost{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.8rem;text-decoration:underline;}
  .error-box{
    background:rgba(224,80,122,0.1);border:1px solid rgba(224,80,122,0.35);color:var(--rose-soft);
    padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-top:12px;
  }
  .footer-note{color:var(--muted);font-size:0.78rem;text-align:center;margin-top:32px;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-text">
      <div class="brand-lockup">
        <p class="chrome-line">Dancing with the Stars</p>
        <p class="gold-line">Fantasy League &middot; Leaderboard</p>
        <svg class="sparkle sp1" width="14" height="14" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z" fill="#ffffff"/></svg>
        <svg class="sparkle sp2" width="10" height="10" viewBox="0 0 24 24"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z" fill="#E8CA6E"/></svg>
      </div>
    </div>
  </header>

  <div id="metaRow" class="meta-row" style="display:none;">
    <div style="display:flex;align-items:center;gap:10px;">
      <select id="seasonPicker" onchange="onSeasonPickerChange()" style="background:var(--bg-panel-raised);border:1px solid var(--line);color:var(--gold-soft);border-radius:6px;padding:6px 10px;font-size:0.85rem;font-family:'Inter';font-weight:700;"></select>
      <span id="metaStartDate" style="font-size:0.8rem;color:var(--muted);"></span>
    </div>
    <div id="metaUpdated"></div>
  </div>

  <div id="loadState" class="load-card">
    <p>Looking for this week's standings&hellip;</p>
  </div>

  <h2 id="standingsHeading" style="display:none;font-family:'Bebas Neue';font-size:1.3rem;letter-spacing:0.03em;color:var(--gold-soft);margin:0 0 12px;">Standings</h2>
  <div id="standingsList"></div>

  <div class="card" id="progressionChartCard" style="display:none;margin-top:8px;">
    <div style="font-weight:700;margin-bottom:10px;font-size:0.95rem;">Score Progression</div>
    <div id="progressionChartWrap"></div>
    <div id="progressionLegend" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;"></div>
  </div>

  <div id="castTeamsSection" style="display:none;margin-top:24px;">
    <h2 style="font-family:'Bebas Neue';font-size:1.3rem;letter-spacing:0.03em;color:var(--gold-soft);margin:0 0 4px;">Cast &amp; Teams</h2>
    <p style="color:var(--muted);font-size:0.85rem;margin:0 0 14px;">Tap a team to see their full roster.</p>
    <div id="castTeamsList"></div>
  </div>

  <p class="footer-note" id="footerNote" style="display:none;">Read-only view &middot; scores are logged in the main Mirrorball Ledger app</p>
</div>

<script>
let data = null;
let selectedSeason = null;

function fmtDate(iso){
  if(!iso) return "";
  try{
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) +
      " at " + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }catch(e){ return ""; }
}
function formatDisplayDate(isoDate){
  if(!isoDate) return '';
  const [y,m,d] = isoDate.split('-').map(Number);
  if(!y||!m||!d) return '';
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function contrastText(hex){
  if(!hex) return '#14121B';
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b)/255;
  return luminance > 0.55 ? '#14121B' : '#F3EEE4';
}

function sd(){ return data.seasons[selectedSeason]; }
function ownerById(id){ return sd().owners.find(o=>o.id===id); }
function categoryById(id){ return sd().categories.find(c=>c.id===id); }
function dancerById(id){ return sd().dancers.find(d=>d.id===id); }
function ownersForDancer(dancerId){
  return sd().draft.filter(d=>d.dancerId===dancerId).map(d=>d.ownerId);
}
function allInstances(){
  const out = [];
  (sd().events||[]).forEach(ev=>{
    const cat = categoryById(ev.categoryId);
    if(!cat) return;
    ev.instances.forEach(inst=>{
      ownersForDancer(inst.dancerId).forEach(ownerId=>{
        out.push({week:ev.week, categoryLabel:cat.label, points:cat.points, enabled:cat.enabled, dancerId:inst.dancerId, ownerId});
      });
    });
  });
  return out;
}
function ownerTotal(ownerId){
  return allInstances().filter(i=>i.ownerId===ownerId && i.enabled!==false).reduce((s,i)=>s+i.points,0);
}
function ownerDisplayName(o){
  if(!o) return '?';
  return o.teamName ? o.teamName : o.name;
}

function seasonOptionsList(){
  return Object.keys(data.seasons).sort((a,b)=>{
    const da = data.seasons[a].startDate || '';
    const db = data.seasons[b].startDate || '';
    if(da && db) return da < db ? -1 : (da > db ? 1 : 0);
    if(da) return -1;
    if(db) return 1;
    return a.localeCompare(b, undefined, {numeric:true});
  });
}
function populateSeasonPicker(){
  const sel = document.getElementById('seasonPicker');
  const opts = seasonOptionsList();
  sel.innerHTML = opts.map(name=>`<option value="${name}">${name}</option>`).join('');
  sel.value = selectedSeason;
}
function onSeasonPickerChange(){
  selectedSeason = document.getElementById('seasonPicker').value;
  renderLeaderboard();
}

function renderProgressionChart(){
  const card = document.getElementById('progressionChartCard');
  const wrap = document.getElementById('progressionChartWrap');
  const legend = document.getElementById('progressionLegend');
  if(!card) return;

  if(!sd().events || sd().events.length===0 || !sd().owners || sd().owners.length===0){
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  const maxWeek = Math.max(...sd().events.map(e=>e.week));
  const weeks = [0];
  for(let w=1; w<=maxWeek; w++) weeks.push(w);

  const series = {};
  sd().owners.forEach(o=>{
    series[o.id] = weeks.map(w=>{
      let total = 0;
      allInstances().forEach(i=>{
        if(i.enabled===false) return;
        if(i.ownerId===o.id && i.week<=w) total += i.points;
      });
      return total;
    });
  });

  let allVals = [0];
  Object.values(series).forEach(arr=> allVals = allVals.concat(arr));
  const maxVal = Math.max(...allVals, 1);
  const minVal = Math.min(...allVals, 0);

  const W = 640, H = 260, ML = 42, MR = 118, MT = 16, MB = 30;
  const plotW = W - ML - MR, plotH = H - MT - MB;
  const xFor = (idx) => ML + (weeks.length>1 ? idx/(weeks.length-1) : 0.5) * plotW;
  const yBase = (val) => MT + plotH - ((val - minVal) / ((maxVal - minVal)||1)) * plotH;

  const n = sd().owners.length;
  const staggerStep = 4.5;
  const yFor = (val, idx) => yBase(val) + (idx - (n-1)/2) * staggerStep;

  let gridLines = '';
  const gridSteps = 4;
  for(let g=0; g<=gridSteps; g++){
    const val = minVal + (g/gridSteps)*(maxVal-minVal);
    const y = yBase(val);
    gridLines += `<line x1="${ML}" y1="${y}" x2="${W-MR}" y2="${y}" stroke="var(--line)" stroke-width="1" />`;
    gridLines += `<text x="${ML-8}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${Math.round(val)}</text>`;
  }

  let xLabels = '';
  const labelEvery = weeks.length > 14 ? 2 : 1;
  weeks.forEach((w,idx)=>{
    if(idx % labelEvery !== 0 && idx !== weeks.length-1) return;
    xLabels += `<text x="${xFor(idx)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${w}</text>`;
  });

  function truncateLabel(str){
    return str.length > 16 ? str.slice(0,15) + '…' : str;
  }

  let lines = '';
  let endLabels = '';
  const lastIdx = weeks.length - 1;
  sd().owners.forEach((o, ownerIdx)=>{
    const pts = series[o.id].map((v,idx)=>`${xFor(idx)},${yFor(v, ownerIdx)}`).join(' ');
    const color = o.color || '#D4AF37';
    lines += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.95" />`;
    series[o.id].forEach((v,idx)=>{
      lines += `<circle cx="${xFor(idx)}" cy="${yFor(v, ownerIdx)}" r="2.5" fill="${color}"><title>${ownerDisplayName(o)} — Wk ${weeks[idx]}: ${v}</title></circle>`;
    });
    const lastVal = series[o.id][lastIdx];
    const lx = xFor(lastIdx) + 8;
    const ly = yFor(lastVal, ownerIdx);
    endLabels += `<text x="${lx}" y="${ly+3}" font-size="9.5" font-weight="700" fill="${color}">${truncateLabel(ownerDisplayName(o))}</text>`;
  });
  lines += endLabels;

  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    ${gridLines}${xLabels}${lines}
  </svg>`;

  legend.innerHTML = sd().owners.map(o=>{
    const color = o.color || '#D4AF37';
    return `<span style="display:flex;align-items:center;gap:6px;font-size:0.8rem;color:var(--muted);">
      <span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;"></span>
      ${ownerDisplayName(o)}
    </span>`;
  }).join('');
}

function dancersForOwner(ownerId){
  return sd().draft.filter(d=>d.ownerId===ownerId).map(d=>dancerById(d.dancerId)).filter(Boolean);
}
function dancerPointTotal(dancerId){
  return allInstances().filter(i=>i.dancerId===dancerId && i.enabled!==false).reduce((s,i)=>s+i.points,0);
}
function renderCastTeams(){
  const section = document.getElementById('castTeamsSection');
  const wrap = document.getElementById('castTeamsList');
  if(!section || !wrap) return;
  if(!sd().owners || sd().owners.length===0){
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  wrap.innerHTML = sd().owners.map(o=>{
    const dancers = dancersForOwner(o.id);
    const rows = dancers.length
      ? `<div class="dancer-grid" style="margin-top:2px;">${dancers.map(d=>{
          const pts = dancerPointTotal(d.id);
          const cls = pts>=0 ? 'pts-pos' : 'pts-neg';
          return `<div class="dancer-row"><div class="dname">${d.name}<span class="pname">${d.partner}</span></div><div class="${cls}" style="font-size:0.85rem;white-space:nowrap;">${pts>0?'+':''}${pts} pts</div></div>`;
        }).join('')}</div>`
      : `<p class="empty-note">No dancers drafted yet.</p>`;
    const sub = o.teamName ? `<div class="owner-name">${o.name}</div>` : '';
    return `<div class="standing-card" id="cast-card-${o.id}">
      <div class="standing-head" onclick="document.getElementById('cast-card-${o.id}').classList.toggle('open')">
        <div class="standing-left">
          <div>
            <div class="team-name">${ownerDisplayName(o)}</div>
            ${sub}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <span style="color:var(--muted);font-size:0.85rem;">${dancers.length} dancer${dancers.length===1?'':'s'}</span>
          <div class="chevron">&#9660;</div>
        </div>
      </div>
      <div class="standing-detail">
        ${rows}
      </div>
    </div>`;
  }).join('');
}

function renderLeaderboard(){
  document.getElementById('loadState').style.display = 'none';
  document.getElementById('footerNote').style.display = 'block';
  document.getElementById('standingsHeading').style.display = 'block';

  const metaRow = document.getElementById('metaRow');
  metaRow.style.display = 'flex';
  populateSeasonPicker();
  document.getElementById('metaStartDate').textContent = sd().startDate ? formatDisplayDate(sd().startDate) : '';
  document.getElementById('metaUpdated').textContent = data.exportedAt ? ('Updated ' + fmtDate(data.exportedAt)) : '';

  renderProgressionChart();
  renderCastTeams();

  const rows = sd().owners.map(o=>({owner:o,total:ownerTotal(o.id)})).sort((a,b)=>b.total-a.total);
  const list = document.getElementById('standingsList');
  list.innerHTML = rows.map((r,idx)=>{
    const rankClass = idx===0 ? 'rank-1' : '';
    const detail = allInstances().filter(i=>i.ownerId===r.owner.id && i.enabled!==false).sort((a,b)=>b.week-a.week);
    const detailRows = detail.length ? detail.map(i=>{
      const d = dancerById(i.dancerId);
      const cls = i.points>=0 ? 'pts-pos':'pts-neg';
      return `<tr>
        <td><span class="week-pill">Wk ${i.week}</span></td>
        <td>${i.categoryLabel}</td>
        <td>${d?d.name:'?'} <span style="color:var(--muted);">/ ${d?d.partner:'?'}</span></td>
        <td class="${cls}">${i.points>0?'+':''}${i.points}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="4" class="empty-note">No points logged yet for this team.</td></tr>`;

    return `<div class="standing-card ${rankClass}" id="card-${r.owner.id}">
      <div class="standing-head" onclick="document.getElementById('card-${r.owner.id}').classList.toggle('open')">
        <div class="standing-left">
          <div class="rank-badge">#${idx+1}</div>
          <div>
            <div class="team-name">
              ${r.owner.teamName ? r.owner.teamName : r.owner.name}
              ${r.owner.color ? `<span class="owner-badge" style="background:${r.owner.color};color:${contrastText(r.owner.color)};margin-left:6px;">&nbsp;</span>` : ''}
            </div>
            ${r.owner.teamName ? `<div class="owner-name">${r.owner.name}</div>` : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div class="standing-score">${r.total}</div>
          <div class="chevron">&#9660;</div>
        </div>
      </div>
      <div class="standing-detail">
        <div class="scores-heading">Scores</div>
        <table class="breakdown">
          <thead><tr><th>Week</th><th>Category</th><th>Dancer / Celebrity</th><th>Pts</th></tr></thead>
          <tbody>${detailRows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function showLoadPrompt(message){
  const box = document.getElementById('loadState');
  box.style.display = 'block';
  box.innerHTML = `<p>${message}</p>`;
}

function normalizeLoadedData(parsed){
  if(parsed.seasons && parsed.currentSeason){
    return parsed;
  }
  if(parsed.dancers && parsed.owners){
    // Legacy single-season export: wrap it into the multi-season shape.
    const name = parsed.seasonName || 'Season';
    const season = {
      startDate: parsed.startDate || '',
      dancers: parsed.dancers, owners: parsed.owners, draft: parsed.draft || [],
      draftOrder: parsed.draftOrder || [], draftRules: parsed.draftRules || {orderSource:'manual', maxDraftCount:2},
      categories: parsed.categories || [], events: parsed.events || []
    };
    return { currentSeason: name, seasons: { [name]: season }, exportedAt: parsed.exportedAt };
  }
  throw new Error("bad shape");
}

function handleLoadedData(parsed){
  data = normalizeLoadedData(parsed);
  const opts = seasonOptionsList();
  selectedSeason = data.seasons[data.currentSeason] ? data.currentSeason : opts[opts.length-1];
  renderLeaderboard();
}

/* Try to auto-load leaderboard-data.json sitting next to this page (works when hosted, e.g. GitHub Pages) */
fetch('./leaderboard-data.json', {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('not found'); return r.json(); })
  .then(json=>{ handleLoadedData(json); })
  .catch(()=>{
    showLoadPrompt("No standings available yet — check back after the next update.");
  });
</script>
</body>
</html>
